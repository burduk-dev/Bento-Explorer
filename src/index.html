<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Bento Explorer</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./enhanced.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark"><svg viewBox="0 0 32 32"><rect x="3" y="3" width="12" height="12" rx="4"/><rect x="17" y="3" width="12" height="8" rx="3"/><rect x="17" y="13" width="12" height="16" rx="4"/><rect x="3" y="17" width="12" height="12" rx="4"/></svg></div><div><strong>Bento</strong><span>EXPLORER</span></div></div>
      <button class="nav-item active" data-route="home"><span class="nav-icon" data-icon="home"></span><span>Главная</span><kbd>Alt+H</kbd></button>
      <button class="nav-item" data-route="recent"><span class="nav-icon" data-icon="clock"></span><span>Недавние</span></button>
      <div class="side-label">ИЗБРАННОЕ <button id="add-favorite" class="icon-button tiny" title="Добавить текущую папку">+</button></div>
      <div id="favorites" class="nav-stack"></div>
      <div class="side-label">БИБЛИОТЕКА</div>
      <div id="library" class="nav-stack"></div>
      <div class="side-label">ТЕГИ <button id="add-tag" class="icon-button tiny" title="Создать тег">+</button></div>
      <div id="tag-stack" class="nav-stack"></div>
      <div class="side-label drive-heading">УСТРОЙСТВА <button id="refresh-drives" class="icon-button tiny" title="Обновить диски"><span data-icon="refresh-cw"></span></button></div>
      <div id="drives" class="nav-stack"></div>
      <div class="sidebar-bottom"><div class="avatar">B</div><div class="profile-copy"><strong>Локальный компьютер</strong><span>Файлы на этом устройстве</span></div><button class="icon-button" id="settings-button" title="Настройки"><span data-icon="settings-2"></span></button></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="window-drag"></div>
        <div class="top-left"><button class="icon-button" id="back" title="Назад (Alt+←)"><span data-icon="arrow-left"></span></button><button class="icon-button" id="forward" title="Вперёд (Alt+→)"><span data-icon="arrow-right"></span></button><button class="icon-button" id="up" title="На уровень выше (Alt+↑)"><span data-icon="arrow-up"></span></button></div>
        <div class="address-wrap"><span data-icon="folder"></span><input id="address" spellcheck="false" aria-label="Путь к папке"><button id="go-address" class="icon-button small" title="Перейти"><span data-icon="arrow-right"></span></button></div>
        <div class="top-actions"><button class="icon-button" id="toggle-theme" title="Переключить тему"><span data-icon="sun-moon"></span></button><button class="window-button" id="minimize" title="Свернуть">—</button><button class="window-button close" id="close-window" title="Закрыть">×</button></div>
      </header>
      <div id="tabbar" class="tabbar" aria-label="Вкладки"><div id="tabs" class="tabs"></div><button id="new-tab" class="icon-button" title="Новая вкладка (Ctrl+T)">+</button></div>
      <section class="content">
        <div class="welcome-row"><div><div class="eyebrow" id="eyebrow">ВАШЕ ПРОСТРАНСТВО</div><h1 id="page-title">Главная</h1><p id="page-subtitle">Всё важное — рядом. Без лишнего шума.</p></div><button class="primary-button" id="new-folder"><span data-icon="folder-plus"></span> Новая папка</button></div>
        <div class="quick-cards" id="quick-cards">
          <button class="quick-card blue" data-special="Desktop"><span class="quick-icon" data-icon="monitor"></span><span><strong>Рабочий стол</strong><small>Быстрый доступ</small></span><span class="quick-arrow" data-icon="arrow-up-right"></span></button>
          <button class="quick-card violet" data-special="Downloads"><span class="quick-icon" data-icon="download"></span><span><strong>Загрузки</strong><small>Недавние файлы</small></span><span class="quick-arrow" data-icon="arrow-up-right"></span></button>
          <button class="quick-card amber" data-special="Documents"><span class="quick-icon" data-icon="file-text"></span><span><strong>Документы</strong><small>Ваши материалы</small></span><span class="quick-arrow" data-icon="arrow-up-right"></span></button>
          <button class="quick-card mint" data-special="Pictures"><span class="quick-icon" data-icon="image"></span><span><strong>Изображения</strong><small>Визуальные файлы</small></span><span class="quick-arrow" data-icon="arrow-up-right"></span></button>
        </div>
        <div class="section-heading"><div><h2 id="items-title">Недавно открывали</h2><span id="item-count" class="muted">Загрузка…</span></div><div class="view-controls"><div class="search-box"><span data-icon="search"></span><input id="search" placeholder="Найти в папке…" aria-label="Поиск в текущей папке"><kbd>Ctrl K</kbd></div><button class="icon-button view-toggle selected" data-view="grid" title="Сетка"><span data-icon="layout-grid"></span></button><button class="icon-button view-toggle" data-view="list" title="Список"><span data-icon="list"></span></button><button class="icon-button" id="sort-button" title="Сортировка"><span data-icon="arrow-down-wide-narrow"></span></button><button class="icon-button" id="split-toggle" title="Разделённый экран"><span data-icon="columns"></span></button></div></div>
        <div id="breadcrumbs" class="breadcrumbs"></div>
        <div id="panes" class="panes"><div id="file-area" class="file-area grid-view" tabindex="0" aria-label="Содержимое папки"></div><section id="right-pane" class="right-pane hidden"><div class="right-pane-head"><button id="right-up" class="icon-button small" title="На уровень выше"><span data-icon="arrow-up"></span></button><input id="right-address" aria-label="Путь правой панели"><button id="right-go" class="icon-button small" title="Перейти"><span data-icon="arrow-right"></span></button></div><div id="file-area-right" class="file-area grid-view" tabindex="0" aria-label="Содержимое правой панели"></div><div id="right-status" class="right-status"></div></section></div>
        <div id="statusbar" class="statusbar"><span><i class="status-dot"></i><span id="status-text">Готово</span></span><span id="status-path"></span></div>
      </section>
    </main>
  </div>
  <div id="context-menu" class="context-menu hidden" role="menu"></div>
  <div id="gesture-hint" class="gesture-hint hidden"></div>
  <div id="toast" class="toast hidden" role="status"></div>
  <dialog id="name-dialog" class="modal"><form method="dialog" id="name-form"><div class="modal-icon" data-icon="folder-plus"></div><h2 id="dialog-title">Новая папка</h2><p id="dialog-copy">Введите название для новой папки.</p><input id="name-input" autocomplete="off" required><div class="modal-actions"><button type="button" class="secondary-button" id="cancel-dialog">Отмена</button><button class="primary-button" id="confirm-dialog">Создать</button></div></form></dialog>
  <dialog id="properties-dialog" class="modal properties-modal"><form method="dialog"><div class="modal-icon" data-icon="info"></div><h2>Свойства</h2><div id="properties-content"></div><div class="modal-actions"><button class="primary-button">Готово</button></div></form></dialog>
  <script src="./renderer.js"></script>
  <script src="./enhanced.js"></script>
  <script src="./cursor.js"></script>
</body>
</html>
